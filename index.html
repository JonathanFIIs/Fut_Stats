<!-- TOAST NOTIFICATION -->
    <div id="toast">Estatísticas atualizadas</div>

    <script>
        // --- ÍCONES SVG PARA ESTATÍSTICAS ---
        const STAT_ICONS = {
            gols: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 13v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`,
            ast: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>`,
            trave: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 5H5c-1.1 0-2 .9-2 2v12h2V7h14v12h2V7c0-1.1-.9-2-2-2z"/></svg>`,
            def: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>`,
            des: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>`,
            default: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>`
        };

        const DEFAULT_STATS = [
            { id: 'gols', name: 'Gols', short: 'GOL', active: true, target: 50, current: 0 },
            { id: 'ast', name: 'Assists.', short: 'AST', active: true, target: 30, current: 0 },
            { id: 'trave', name: 'Trave', short: 'TRV', active: true, target: 15, current: 0 },
            { id: 'def', name: 'Defesas', short: 'DEF', active: false, target: 20, current: 0 },
            { id: 'des', name: 'Desarmes', short: 'DSB', active: false, target: 40, current: 0 }
        ];

        let state = {
            year: new Date().getFullYear(),
            name: "Jonathan Almeida",
            position: "ATA",
            flag: "br",
            photo: "",
            over: 60,
            stats: JSON.parse(JSON.stringify(DEFAULT_STATS)),
            seasonsHistory: [],
            matchRecords: []
        };

        const STORAGE_KEY = 'pelada_stats_ultimate_v12';

        window.openModal = function(id) {
            if (id === 'modal-config') {
                document.getElementById('input-name').value = state.name;
                document.getElementById('input-position').value = state.position;
                document.getElementById('input-flag').value = state.flag;
                document.getElementById('input-year').value = state.year || new Date().getFullYear();
                renderConfigStatsList();
            }
            if (id === 'modal-seasons') renderSeasonsHistoryList();
            if (id === 'modal-matches-history') renderMatchesHistoryList();
            if (id === 'modal-add-pelada') {
                const container = document.getElementById('quick-add-container');
                container.innerHTML = '';
                document.getElementById('input-match-date').value = new Date().toISOString().split('T')[0];

                const activeStats = state.stats.filter(s => s.active);
                if (activeStats.length === 0) {
                    container.innerHTML = '<p style="grid-column: span 2; text-align:center; color:var(--text-secondary); font-size:0.8rem;">Ative estatísticas nas configurações.</p>';
                } else {
                    activeStats.forEach(s => {
                        container.innerHTML += `
                            <div class="quick-add-card">
                                <label>${s.name}</label>
                                <div class="quick-add-counter">
                                    <button class="btn-counter" type="button" onclick="adjustInputVal('${s.id}', -1)">-</button>
                                    <input type="number" id="input-add-${s.id}" value="0" min="0" readonly style="width:45px; background:none; border:none; color:white; font-family:'Rajdhani',sans-serif; font-weight:800; font-size:1.6rem; text-align:center;">
                                    <button class="btn-counter" type="button" onclick="adjustInputVal('${s.id}', 1)">+</button>
                                </div>
                            </div>
                        `;
                    });
                }
            }
            const modal = document.getElementById(id);
            if (modal) modal.classList.add('active');
        };

        window.closeModal = function(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('active');
        };

        window.adjustInputVal = function(statId, delta) {
            const input = document.getElementById(`input-add-${statId}`);
            if (input) {
                let currentVal = parseInt(input.value) || 0;
                input.value = Math.max(0, currentVal + delta);
            }
        };

        window.savePeladaStats = function() {
            const activeStats = state.stats.filter(s => s.active);
            const matchDate = document.getElementById('input-match-date').value;
            let recordData = { id: 'match_' + Date.now(), date: matchDate, stats: {} };
            let hasAdded = false;

            activeStats.forEach(s => {
                const input = document.getElementById(`input-add-${s.id}`);
                if (input) {
                    const addVal = parseInt(input.value) || 0;
                    if (addVal > 0) {
                        s.current += addVal;
                        recordData.stats[s.id] = addVal;
                        hasAdded = true;
                    }
                }
            });

            if (hasAdded) {
                if (!state.matchRecords) state.matchRecords = [];
                state.matchRecords.unshift(recordData);
            }

            calculateOver();
            saveState();
            renderAll();
            closeModal('modal-add-pelada');
            showToast(hasAdded ? 'Registro salvo com sucesso!' : 'Nenhum valor adicionado');
        };

        function renderMatchesHistoryList() {
            const container = document.getElementById('matches-history-list');
            container.innerHTML = '';

            if (!state.matchRecords || state.matchRecords.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); font-size:0.8rem; text-align:center;">Nenhum jogo registrado nesta temporada.</p>';
                return;
            }

            state.matchRecords.forEach((m, idx) => {
                const statsSummary = Object.keys(m.stats).map(statId => {
                    const statObj = state.stats.find(s => s.id === statId);
                    return `${statObj ? statObj.name : statId}: +${m.stats[statId]}`;
                }).join(' | ');

                container.innerHTML += `
                    <div class="match-record-card">
                        <div class="match-record-info">
                            <span class="match-record-date">📅 Data: ${m.date || 'Jogo'}</span>
                            <span class="match-record-stats">${statsSummary}</span>
                        </div>
                        <button class="btn-delete-stat" type="button" onclick="deleteMatchRecord(${idx})" title="Excluir Registro">
                            <svg class="svg-icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;
            });
        }

        window.deleteMatchRecord = function(idx) {
            if (confirm("Deseja realmente excluir este registro? Os números serão subtraídos do seu total.")) {
                const record = state.matchRecords[idx];
                Object.keys(record.stats).forEach(statId => {
                    const statObj = state.stats.find(s => s.id === statId);
                    if (statObj) {
                        statObj.current = Math.max(0, statObj.current - record.stats[statId]);
                    }
                });

                state.matchRecords.splice(idx, 1);
                calculateOver();
                saveState();
                renderAll();
                renderMatchesHistoryList();
                showToast('Registro excluído');
            }
        };

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {
                    console.error("Error loading state", e);
                }
            }
            calculateOver();
            renderAll();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch(e) {
                console.warn("Erro ao salvar no LocalStorage:", e);
            }
        }

        function calculateOver() {
            const activeStats = state.stats.filter(s => s.active);
            if (activeStats.length === 0) {
                state.over = 60;
                return;
            }

            let totalProgress = 0;
            activeStats.forEach(s => {
                const ratio = s.target > 0 ? (s.current / s.target) : 0;
                totalProgress += ratio;
            });

            const avgProgress = totalProgress / activeStats.length;
            let computedOver = Math.floor(60 + (40 * avgProgress));
            if (computedOver < 60) computedOver = 60;

            state.over = computedOver;
        }

        function calculateAttributes(over, pos) {
            let weights = { rit: 0, fin: 0, pas: 0, dri: 0, def: 0, fis: 0 };

            switch(pos) {
                case 'ATA':
                    weights = { rit: 3, fin: 5, pas: -2, dri: 2, def: -12, fis: -1 };
                    break;
                case 'MEI':
                    weights = { rit: -1, fin: 1, pas: 5, dri: 4, def: -4, fis: -2 };
                    break;
                case 'VOL':
                    weights = { rit: -1, fin: -3, pas: 3, dri: 1, def: 4, fis: 3 };
                    break;
                case 'DEF':
                    weights = { rit: -2, fin: -12, pas: -2, dri: -6, def: 6, fis: 5 };
                    break;
                case 'LAT':
                    weights = { rit: 6, fin: -7, pas: 2, dri: 1, def: 2, fis: 0 };
                    break;
                case 'GOL':
                    weights = { rit: 0, fin: -15, pas: -2, dri: -10, def: 7, fis: 4 };
                    break;
                default:
                    weights = { rit: 0, fin: 0, pas: 0, dri: 0, def: 0, fis: 0 };
            }

            const calc = (val) => Math.max(1, Math.floor(over + val));

            return {
                rit: { label: 'RIT', val: calc(weights.rit) },
                fin: { label: pos === 'GOL' ? 'REF' : 'FIN', val: calc(weights.fin) },
                pas: { label: pos === 'GOL' ? 'LAN' : 'PAS', val: calc(weights.pas) },
                dri: { label: pos === 'GOL' ? 'MÃO' : 'DRI', val: calc(weights.dri) },
                def: { label: pos === 'GOL' ? 'DEF' : 'DEF', val: calc(weights.def) },
                fis: { label: pos === 'GOL' ? 'POS' : 'FIS', val: calc(weights.fis) }
            };
        }

        function renderAll() {
            renderCard();
            renderStatsDashboard();
            renderExportBannerStats();
        }

        function renderCard() {
            const cardEl = document.getElementById('fut-card');
            const ratingEl = document.getElementById('card-rating');
            const nameEl = document.getElementById('card-name');
            const posEl = document.getElementById('card-position');
            const flagEl = document.getElementById('card-flag');
            const photoEl = document.getElementById('card-photo');
            const attrGridEl = document.getElementById('card-attributes-grid');

            ratingEl.innerText = state.over;
            nameEl.innerText = state.name.toUpperCase();
            posEl.innerText = state.position;
            flagEl.src = `https://flagcdn.com/w40/${state.flag.toLowerCase()}.png`;

            if (state.photo) {
                photoEl.src = state.photo;
            }

            cardEl.classList.remove('bronze', 'silver', 'gold', 'black');
            if (state.over < 75) {
                cardEl.classList.add('bronze');
            } else if (state.over < 85) {
                cardEl.classList.add('silver');
            } else if (state.over < 99) {
                cardEl.classList.add('gold');
            } else {
                cardEl.classList.add('black');
            }

            const a = calculateAttributes(state.over, state.position);
            attrGridEl.innerHTML = `
                <div class="attr-row"><span class="attr-value">${a.rit.val}</span><span class="attr-label">${a.rit.label}</span></div>
                <div class="attr-row"><span class="attr-value">${a.dri.val}</span><span class="attr-label">${a.dri.label}</span></div>
                <div class="attr-row"><span class="attr-value">${a.fin.val}</span><span class="attr-label">${a.fin.label}</span></div>
                <div class="attr-row"><span class="attr-value">${a.def.val}</span><span class="attr-label">${a.def.label}</span></div>
                <div class="attr-row"><span class="attr-value">${a.pas.val}</span><span class="attr-label">${a.pas.label}</span></div>
                <div class="attr-row"><span class="attr-value">${a.fis.val}</span><span class="attr-label">${a.fis.label}</span></div>
            `;
        }

        function renderStatsDashboard() {
            const container = document.getElementById('stats-appito-container');
            container.innerHTML = '';

            const activeStats = state.stats.filter(s => s.active);
            if (activeStats.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); font-size:0.8rem; grid-column:span 3; text-align:center;">Nenhuma estatística ativada.</p>';
                return;
            }

            activeStats.forEach(s => {
                const iconSvg = STAT_ICONS[s.id] || STAT_ICONS.default;
                container.innerHTML += `
                    <div class="appito-stat-unit">
                        <div class="appito-icon-badge">${iconSvg}</div>
                        <div class="appito-stat-content">
                            <span class="appito-stat-label">${s.name}</span>
                            <span class="appito-stat-val">${s.current}</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('current-year-tag').innerText = state.year || new Date().getFullYear();
        }

        function renderExportBannerStats() {
            const bannerContainer = document.getElementById('export-banner-stats');
            const exportYearTag = document.getElementById('export-year-tag');
            if (exportYearTag) exportYearTag.innerText = state.year || new Date().getFullYear();

            if (!bannerContainer) return;
            bannerContainer.innerHTML = '';

            const activeStats = state.stats.filter(s => s.active);
            activeStats.forEach(s => {
                const iconSvg = STAT_ICONS[s.id] || STAT_ICONS.default;
                bannerContainer.innerHTML += `
                    <div class="export-stat-card">
                        <div class="export-stat-badge">${iconSvg}</div>
                        <div class="export-stat-content">
                            <span class="export-stat-lbl">${s.name}</span>
                            <span class="export-stat-val">${s.current}</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderConfigStatsList() {
            const container = document.getElementById('config-stats-list');
            container.innerHTML = '';

            state.stats.forEach((s) => {
                container.innerHTML += `
                    <div class="stat-config-row">
                        <input type="checkbox" class="checkbox-custom" id="check-stat-${s.id}" ${s.active ? 'checked' : ''}>
                        <span style="font-size:0.85rem; font-weight:600;">${s.name}</span>
                        <input type="number" class="form-control" id="target-stat-${s.id}" value="${s.target}" min="1" placeholder="Meta" style="padding: 6px 10px;">
                        <button class="btn-delete-stat" type="button" onclick="deleteStat('${s.id}')" title="Excluir estatística">
                            <svg class="svg-icon" viewBox="0 0 24 24" style="width:18px; height:18px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;
            });
        }

        window.deleteStat = function(statId) {
            state.stats = state.stats.filter(s => s.id !== statId);
            calculateOver();
            saveState();
            renderAll();
            renderConfigStatsList();
            showToast('Estatística excluída');
        };

        window.addCustomStat = function() {
            const input = document.getElementById('input-custom-stat-name');
            const name = input.value.trim();
            if (!name) return;

            const id = 'custom_' + Date.now();
            const short = name.substring(0, 3).toUpperCase();
            state.stats.push({
                id: id,
                name: name,
                short: short,
                active: true,
                target: 20,
                current: 0
            });

            input.value = '';
            renderConfigStatsList();
            showToast('Estatística criada');
        };

        window.saveSettings = function() {
            state.name = document.getElementById('input-name').value.trim() || "Jogador";
            state.position = document.getElementById('input-position').value;
            state.flag = document.getElementById('input-flag').value;
            state.year = parseInt(document.getElementById('input-year').value) || new Date().getFullYear();

            state.stats.forEach((s) => {
                const checkEl = document.getElementById(`check-stat-${s.id}`);
                const targetEl = document.getElementById(`target-stat-${s.id}`);
                if (checkEl && targetEl) {
                    s.active = checkEl.checked;
                    s.target = parseInt(targetEl.value) || 1;
                }
            });

            calculateOver();
            saveState();
            renderAll();
            closeModal('modal-config');
            showToast('Configurações salvas com sucesso!');
        };

        window.finishSeason = function() {
            if (confirm("Tem certeza que deseja encerrar a temporada atual? Seus dados serão salvos no histórico e o card voltará ao nível inicial.")) {
                const savedSeason = {
                    id: 'season_' + Date.now(),
                    year: state.year || new Date().getFullYear(),
                    over: state.over,
                    position: state.position,
                    stats: JSON.parse(JSON.stringify(state.stats))
                };

                if (!state.seasonsHistory) state.seasonsHistory = [];
                state.seasonsHistory.unshift(savedSeason);

                state.year = (state.year || new Date().getFullYear()) + 1;
                state.stats.forEach(s => s.current = 0);
                state.matchRecords = [];

                calculateOver();
                saveState();
                renderAll();
                renderSeasonsHistoryList();
                showToast(`Temporada ${savedSeason.year} encerrada! Ano ${state.year} iniciado.`);
            }
        };

        function renderSeasonsHistoryList() {
            const container = document.getElementById('seasons-history-list');
            container.innerHTML = '';

            if (!state.seasonsHistory || state.seasonsHistory.length === 0) {
                container.innerHTML = '<p style="color:var(--text-secondary); font-size:0.8rem; text-align:center;">Nenhuma temporada anterior salva ainda.</p>';
                return;
            }

            state.seasonsHistory.forEach((s, idx) => {
                container.innerHTML += `
                    <div class="season-history-card">
                        <div class="season-history-info">
                            <span class="season-history-year">Ano ${s.year}</span>
                            <span class="season-history-over">OVER Final: ${s.over} | Posição: ${s.position}</span>
                        </div>
                        <div class="season-actions">
                            <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.75rem;" type="button" onclick="restoreSeason(${idx})">Restaurar</button>
                            <button class="btn-delete-stat" type="button" onclick="deleteSeason(${idx})" title="Excluir Temporada">
                                <svg class="svg-icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.deleteSeason = function(idx) {
            if (confirm("Deseja realmente excluir o histórico desta temporada?")) {
                state.seasonsHistory.splice(idx, 1);
                saveState();
                renderSeasonsHistoryList();
                showToast('Temporada excluída do histórico');
            }
        };

        window.restoreSeason = function(idx) {
            if (confirm("Deseja restaurar as estatísticas e o nível do card desta temporada no seu perfil atual?")) {
                const target = state.seasonsHistory[idx];
                state.year = target.year;
                state.over = target.over;
                state.position = target.position;
                state.stats = JSON.parse(JSON.stringify(target.stats));

                calculateOver();
                saveState();
                renderAll();
                closeModal('modal-seasons');
                showToast(`Temporada ${target.year} restaurada!`);
            }
        };

        window.handlePhotoUpload = function(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                if (file.type !== 'image/png') {
                    alert('Por favor, selecione um arquivo no formato PNG (de preferência com fundo transparente).');
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxDim = 450;
                        let w = img.width;
                        let h = img.height;

                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }

                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        state.photo = canvas.toDataURL('image/png');
                        renderCard();
                        saveState();
                        showToast('Foto PNG carregada com sucesso!');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.generateCardImage = function() {
            const futCard = document.getElementById('fut-card');
            const cloneContainer = document.getElementById('export-card-clone-container');
            cloneContainer.innerHTML = '';
            cloneContainer.appendChild(futCard.cloneNode(true));

            const exportArea = document.getElementById('export-card-area');

            showToast('Gerando imagem com estatísticas...');
            html2canvas(exportArea, {
                scale: 3,
                useCORS: true,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const imgUrl = canvas.toDataURL('image/png');
                document.getElementById('share-card-image').src = imgUrl;
                document.getElementById('download-card-btn').href = imgUrl;
                openModal('modal-share');
            }).catch(err => {
                console.error(err);
                alert("Erro ao gerar imagem.");
            });
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            }
        });
    </script>
</body>
</html>
